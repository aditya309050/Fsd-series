<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f3f7ff, #dfeeff, #edf8ff);
            font-family: Arial, sans-serif;
        }

        .signup-card {
            width: min(520px, 92vw);
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(75, 118, 177, 0.18);
            padding: 32px 28px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;
            font-size: 2rem;
            color: #152b46;
        }

        .header p {
            margin: 8px 0 0;
            color: #697b96;
            font-size: 0.95rem;
        }

        form {
            display: grid;
            gap: 18px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #20365b;
        }

        input,
        select {
            width: 100%;
            height: 46px;
            padding: 10px 12px;
            border: 1px solid #d5e4ff;
            border-radius: 12px;
            background: #f9fbff;
            font-size: 1rem;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #5a8ef7;
            box-shadow: 0 0 0 4px rgba(90, 142, 247, 0.12);
            background: #fff;
        }

        input[type="file"] {
            padding: 10px;
            background: #f5f9ff;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #536680;
            font-size: 0.9rem;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #5d8ef7, #3e6fe0);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(62, 111, 224, 0.25);
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .login-link {
            text-align: center;
            margin-top: 14px;
            color: #60718d;
            font-size: 0.92rem;
        }

        .login-link a {
            color: #2d6cdf;
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 550px) {
            .two-col {
                grid-template-columns: 1fr;
            }

            .signup-card {
                padding: 24px 18px;
            }

            .header h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="header">
            <h2>Create Account</h2>
            <p>Join us today and get started</p>
        </div>

        <form>
            <div class="two-col">
                <div class="field">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="field">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="two-col">
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create password" required>
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Your age" required>
                </div>
            </div>

            <div class="two-col">
                <div class="field">
                    <label for="subjects">Subject</label>
                    <select id="subjects" name="subjects">
                        <option value="maths">Maths</option>
                        <option value="science">Science</option>
                        <option value="english">English</option>
                        <option value="hindi">Hindi</option>
                    </select>
                </div>

                <div class="field">
                    <label for="class">Class</label>
                    <input type="text" id="class" placeholder="Your class" required list="class-list">
                    <datalist id="class-list">
                        <option value="11th"></option>
                        <option value="12th"></option>
                    </datalist>
                </div>
            </div>

            <div class="field">
                <label for="file">Upload Resume / Document</label>
                <input type="file" id="file" name="file">
            </div>

            <label class="checkbox-row">
                <input type="checkbox" required>
                <span>I agree to the terms and conditions</span>
            </label>

            <button type="submit">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="#">Login</a>
        </div>
    </div>
</body>
</html>
